name: Publish to Nexus

on:
  push:
    branches: [ "master" ]
    tags:
      - '*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Publish shadow jar to Nexus
        env:
          HolyRepoUser: ${{ secrets.HolyRepoUser }}
          HolyRepoPass: ${{ secrets.HolyRepoPass }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -u "$HolyRepoUser:$HolyRepoPass" \
            --upload-file build/libs/holy-replay-$VERSION.jar \
            "https://repo.gin1.cc/repository/holy-replay/$VERSION/holy-replay-$VERSION.jar"
