name: Publish to Nexus

on:
  push:
    branches: [ "master" ]
    tags:
      - "*"

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HolyRepoUser: ${{ secrets.HolyRepoUser }}
      HolyRepoPass: ${{ secrets.HolyRepoPass }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Publish shadow jar to Nexus
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew clean publish -PprojectVersion="$VERSION"
