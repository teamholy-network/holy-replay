plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
    id 'maven-publish'
}


repositories {
    mavenCentral()
    maven { url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
    // ProtocolLib repo
    maven { url "https://repo.dmulloy2.net/repository/public/" }
    // Libby repo
    maven { url = 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }

    maven {
        url = 'https://repo.gin1.cc/repository/releases/'
        credentials {
            username = System.getenv("HolyRepoUser") ?: HolyRepoUser
            password = System.getenv("HolyRepoPassword") ?: HolyRepoPassword
        }
    }
}

dependencies {
    implementation project(':legacy')

    compileOnly "eu.koboo:en2do:$en2doVersion"
    compileOnly "org.spigotmc:spigot-api:1.21.9-R0.1-SNAPSHOT"
    compileOnly 'com.comphenix.protocol:ProtocolLib:5.3.0'

    compileOnly("de.teamholy:holy-core-api:$coreVersion");
    compileOnly "de.teamholy:bukkit-core-api:$coreVersion"

    // Dependency resolver at runtime
    implementation 'com.alessiodp.libby:libby-bukkit:2.0.0-SNAPSHOT'
}

allprojects {
    group = 'de.teamholy.replay'
    version = '1.8.16'

    apply plugin: 'java'
    apply plugin: 'maven-publish'

    java {
        sourceCompatibility = 17
        targetCompatibility = 17
    }

    compileJava {
        options.encoding("UTF-8")
    }

    publishing {
        publications {
            maven(MavenPublication) {
                groupId project.group
                artifactId project.name
                version project.version
                from components.java
            }
        }
    }
}

shadowJar {
    archiveFileName = 'Replay.jar'

    relocate 'com.alessiodp.libby', 'de.teamholy.replay.libs.com.alessiodp.libby'
    relocate 'com.comphenix.packetwrapper', 'de.teamholy.replay.libs.com.comphenix.packetwrapper'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

build {
    dependsOn shadowJar
}